<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Symbols</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: monospace;
      padding: 16px;
      background: #fff;
      color: #000;
    }
    header {
      margin-bottom: 16px;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 8px;
    }
    #search {
      width: 100%;
      font-size: 1rem;
      font-family: inherit;
      padding: 8px 10px;
      border: 1px solid #000;
      outline: none;
      margin-bottom: 6px;
    }
    #count {
      font-size: 0.85rem;
      margin-bottom: 12px;
    }
    .group {
      margin-bottom: 20px;
    }
    .group.hidden {
      display: none;
    }
    .group-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #000;
      margin-bottom: 8px;
      padding-bottom: 2px;
    }
    .group-head h2 {
      font-size: 1rem;
    }
    .group-controls {
      display: flex;
      gap: 4px;
    }
    .move-btn {
      font-family: inherit;
      font-size: 0.85rem;
      border: 1px solid #000;
      background: #fff;
      cursor: pointer;
      padding: 2px 8px;
    }
    .move-btn:hover {
      background: #eee;
    }
    .group-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 4px;
    }
    .cell {
      border: 1px solid #000;
      padding: 8px 4px;
      text-align: center;
      cursor: pointer;
      user-select: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 72px;
    }
    .cell:hover {
      background: #eee;
    }
    .cell:active {
      background: #ccc;
    }
    .cell .char {
      font-size: 1.6rem;
      line-height: 1.2;
      margin-bottom: 4px;
    }
    .cell .name {
      font-size: 0.72rem;
      word-break: break-word;
      padding: 0 2px;
    }
    .cell.hidden {
      display: none;
    }
    #history-section .cell {
      cursor: grab;
    }
    #history-section .cell:active {
      cursor: grabbing;
    }
    #history-section .cell.dragging {
      opacity: 0.4;
    }
    #history-section .cell.placeholder {
      opacity: 0.35;
      border-style: dashed;
    }
    #history-section .cell.drop-target {
      box-shadow: inset 0 0 0 2px #000;
    }
    .cell {
      position: relative;
    }
    .del-btn {
      display: none;
      position: absolute;
      top: 2px;
      right: 2px;
      width: 16px;
      height: 16px;
      line-height: 14px;
      text-align: center;
      font-size: 0.75rem;
      font-family: inherit;
      border: 1px solid #000;
      background: #fff;
      color: #000;
      cursor: pointer;
      padding: 0;
    }
    .del-btn:hover {
      background: #000;
      color: #fff;
    }
    .cell:hover .del-btn {
      display: block;
    }
    #toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      border: 1px solid #000;
      background: #fff;
      color: #000;
      padding: 6px 12px;
      font-size: 0.85rem;
      opacity: 0;
      transition: opacity 0.15s ease-in-out;
      pointer-events: none;
    }
    #toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <header>
    <h1>Mathematical Symbols</h1>
    <input type="search" id="search" placeholder="Type to search symbol by name or character..." autofocus />
    <div id="count">Showing all symbols</div>
  </header>

  <section id="history-section" class="group hidden"></section>

  <main id="grid"></main>
  <div id="toast"></div>

    const grid = document.getElementById('grid');
    const search = document.getElementById('search');
    const countEl = document.getElementById('count');
    const toast = document.getElementById('toast');
    const STORAGE_KEY = 'symbolGroupOrder';

    const totalCount = symbols.filter(e => !e[0].startsWith('#')).length;

    // Parse flat list into categories
    const categories = []; // { name, symbols: [] }
    let current = null;
    symbols.forEach(entry => {
      if (entry[0].startsWith('#')) {
        current = { name: entry[0].slice(1), symbols: [] };
        categories.push(current);
      } else {
        current.symbols.push(entry);
      }
    });

    function loadOrder() {
      const defaultOrder = categories.map(c => c.name);
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (Array.isArray(saved) &&
            saved.length === defaultOrder.length &&
            saved.every(n => defaultOrder.includes(n)) &&
            new Set(saved).size === saved.length) {
          return saved;
        }
      } catch (e) {}
      return defaultOrder;
    }

    function saveOrder(order) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(order));
      } catch (e) {}
    }

    let order = loadOrder();

    const HISTORY_KEY = 'symbolHistory';
    const HISTORY_LIMIT = 24;
    const historySection = document.getElementById('history-section');

    const entryKey = entry => entry[0] + '\u0000' + entry[1];
    const entryByKey = new Map();
    symbols.forEach(entry => {
      if (!entry[0].startsWith('#')) entryByKey.set(entryKey(entry), entry);
    });

    function loadHistory() {
      try {
        const saved = JSON.parse(localStorage.getItem(HISTORY_KEY));
        if (Array.isArray(saved)) {
          return saved.filter(k => entryByKey.has(k));
        }
      } catch (e) {}
      return [];
    }

    function saveHistory() {
      try {
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
      } catch (e) {}
    }

    let history = loadHistory();

    function addToHistory(entry) {
      const key = entryKey(entry);
      const idx = history.indexOf(key);
      if (idx !== -1) history.splice(idx, 1);
      history.unshift(key);
      if (history.length > HISTORY_LIMIT) history.length = HISTORY_LIMIT;
      saveHistory();
      renderHistory();
    }

    function removeFromHistory(key) {
      const idx = history.indexOf(key);
      if (idx === -1) return;
      history.splice(idx, 1);
      saveHistory();
      renderHistory();
    }

    let dragKey = null;
    let placeholder = null;

    function renderHistory() {
      historySection.textContent = '';
      historySection.classList.toggle('hidden', history.length === 0);

      const head = document.createElement('div');
      head.className = 'group-head';
      const title = document.createElement('h2');
      title.textContent = 'History';
      head.appendChild(title);
      historySection.appendChild(head);

      const histGrid = document.createElement('div');
      histGrid.className = 'group-grid';
      histGrid.addEventListener('dragover', e => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        if (!placeholder) return;
        const after = getDragAfterElement(histGrid, e.clientX);
        if (after === placeholder.nextElementSibling) return;
        if (after == null && placeholder === histGrid.lastElementChild) return;
        animateSlide(histGrid, () => {
          if (after == null) histGrid.appendChild(placeholder);
          else histGrid.insertBefore(placeholder, after);
        });
      });
      histGrid.addEventListener('drop', e => {
        e.preventDefault();
        commitHistoryOrder(histGrid);
      });

      history.forEach(key => {
        const entry = entryByKey.get(key);
        const [char, name] = entry;

        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.draggable = true;
        cell.dataset.key = key;
        cell.dataset.name = name.toLowerCase();
        cell.dataset.char = char.toLowerCase();

        const charSpan = document.createElement('span');
        charSpan.className = 'char';
        charSpan.textContent = char;

        const nameSpan = document.createElement('span');
        nameSpan.className = 'name';
        nameSpan.textContent = name;

        const delBtn = document.createElement('button');
        delBtn.className = 'del-btn';
        delBtn.textContent = '✕';
        delBtn.title = 'Remove from history';
        delBtn.addEventListener('click', e => {
          e.stopPropagation();
          removeFromHistory(key);
        });

        cell.appendChild(charSpan);
        cell.appendChild(nameSpan);
        cell.appendChild(delBtn);

        cell.addEventListener('click', () => {
          copyToClipboard(char, entry);
        });

        cell.addEventListener('dragstart', e => {
          dragKey = key;
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', key);
          cell.classList.add('dragging');
          placeholder = cell.cloneNode(true);
          placeholder.classList.remove('dragging');
          placeholder.classList.add('placeholder');
          cell.after(placeholder);
          setTimeout(() => {
            if (placeholder) cell.style.display = 'none';
          }, 0);
        });
        cell.addEventListener('dragend', () => {
          if (placeholder && placeholder.parentNode) {
            placeholder.replaceWith(cell);
          }
          cell.style.display = '';
          cell.classList.remove('dragging');
          placeholder = null;
          dragKey = null;
          commitHistoryOrder(histGrid);
        });

        histGrid.appendChild(cell);
      });

      historySection.appendChild(histGrid);
    }

    function animateSlide(container, mutate) {
      const cells = [...container.querySelectorAll('.cell')];
      const first = new Map(cells.map(c => [c, c.getBoundingClientRect()]));
      mutate();
      cells.forEach(cell => {
        const lastRect = cell.getBoundingClientRect();
        const prevRect = first.get(cell);
        const dx = prevRect.left - lastRect.left;
        const dy = prevRect.top - lastRect.top;
        if (!dx && !dy) return;
        cell.style.transition = 'none';
        cell.style.transform = `translate(${dx}px, ${dy}px)`;
        requestAnimationFrame(() => requestAnimationFrame(() => {
          cell.style.transition = 'transform 0.15s ease-out';
          cell.style.transform = '';
          cell.addEventListener('transitionend', function clear() {
            cell.style.transition = '';
            cell.removeEventListener('transitionend', clear);
          });
        }));
      });
    }

    function getDragAfterElement(container, x) {
      const cells = [...container.querySelectorAll('.cell:not(.dragging):not(.placeholder)')];
      return cells.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = x - box.left - box.width / 2;
        if (offset < 0 && offset > closest.offset) {
          return { offset: offset, element: child };
        }
        return closest;
      }, { offset: Number.NEGATIVE_INFINITY, element: null }).element;
    }

    function commitHistoryOrder(container) {
      const newOrder = [...container.querySelectorAll('.cell')].map(c => c.dataset.key);
      if (newOrder.join('|') !== history.join('|')) {
        history = newOrder;
        saveHistory();
      }
    }

    renderHistory();

    // Build one cell per symbol (kept in a map so sections can be re-rendered)
    const cellMap = new Map(); // symbol entry -> cell element
    symbols.forEach(entry => {
      if (entry[0].startsWith('#')) return;
      const [char, name] = entry;
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.name = name.toLowerCase();
      cell.dataset.char = char.toLowerCase();
      cell.dataset.entry = char + '\u0000' + name;

      const charSpan = document.createElement('span');
      charSpan.className = 'char';
      charSpan.textContent = char;

      const nameSpan = document.createElement('span');
      nameSpan.className = 'name';
      nameSpan.textContent = name;

      cell.appendChild(charSpan);
      cell.appendChild(nameSpan);

      cell.addEventListener('click', () => {
        copyToClipboard(char, entry);
      });

      cellMap.set(entry, cell);
    });

    const sectionsEl = new Map(); // category name -> section element
    const gridEl = new Map(); // category name -> grid element

    function renderSections() {
      grid.textContent = '';
      sectionsEl.clear();
      gridEl.clear();

      order.forEach(catName => {
        const cat = categories.find(c => c.name === catName);

        const section = document.createElement('section');
        section.className = 'group';

        const head = document.createElement('div');
        head.className = 'group-head';

        const title = document.createElement('h2');
        title.textContent = cat.name;
        title.dataset.category = catName;

        const controls = document.createElement('div');
        controls.className = 'group-controls';

        const upBtn = document.createElement('button');
        upBtn.className = 'move-btn';
        upBtn.textContent = '↑';
        upBtn.title = 'Move group up';
        upBtn.addEventListener('click', () => moveGroup(catName, -1));

        const downBtn = document.createElement('button');
        downBtn.className = 'move-btn';
        downBtn.textContent = '↓';
        downBtn.title = 'Move group down';
        downBtn.addEventListener('click', () => moveGroup(catName, 1));

        controls.appendChild(upBtn);
        controls.appendChild(downBtn);
        head.appendChild(title);
        head.appendChild(controls);
        section.appendChild(head);

        const catGrid = document.createElement('div');
        catGrid.className = 'group-grid';
        cat.symbols.forEach(entry => catGrid.appendChild(cellMap.get(entry)));
        section.appendChild(catGrid);

        grid.appendChild(section);
        sectionsEl.set(catName, section);
        gridEl.set(catName, catGrid);
      });
    }

    function moveGroup(catName, dir) {
      const idx = order.indexOf(catName);
      const target = idx + dir;
      if (target < 0 || target >= order.length) return;
      [order[idx], order[target]] = [order[target], order[idx]];
      saveOrder(order);
      renderSections();
      applyFilter(search.value.trim().toLowerCase());
    }

    updateCount(totalCount);

    search.addEventListener('input', () => {
      applyFilter(search.value.trim().toLowerCase());
    });

    function applyFilter(query) {
      let visibleCount = 0;

      historySection.querySelectorAll('.cell').forEach(cell => {
        const name = cell.dataset.name;
        const char = cell.dataset.char;
        const match = !query || name.includes(query) || char.includes(query);
        cell.classList.toggle('hidden', !match);
      });
      const histVisible = historySection.querySelectorAll('.cell:not(.hidden)').length;
      historySection.classList.toggle('hidden', histVisible === 0);

      sectionsEl.forEach((section, catName) => {
        const catGrid = gridEl.get(catName);
        let groupVisible = 0;

        catGrid.querySelectorAll('.cell').forEach(cell => {
          const name = cell.dataset.name;
          const char = cell.dataset.char;
          const match = !query || name.includes(query) || char.includes(query);
          cell.classList.toggle('hidden', !match);
          if (match) groupVisible++;
        });

        visibleCount += groupVisible;
        section.classList.toggle('hidden', groupVisible === 0);
      });

      updateCount(visibleCount);
    }

    renderSections();

    function updateCount(count) {
      if (count === totalCount) {
        countEl.textContent = `Showing all ${totalCount} symbols`;
      } else {
        countEl.textContent = `Showing ${count} of ${totalCount} symbols`;
      }
    }

    let toastTimeout;
    function copyToClipboard(text, entry) {
      if (entry) addToHistory(entry);
      const fallbackCopy = () => {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand('copy');
          showToast(text);
        } catch (err) {
          console.error('Fallback copy failed', err);
        }
        document.body.removeChild(textarea);
      };

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text)
          .then(() => showToast(text))
          .catch(() => fallbackCopy());
      } else {
        fallbackCopy();
      }
    }

    function showToast(text) {
      toast.textContent = `Copied "${text}"`;
      toast.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 1200);
    }
  </script>
</body>
</html>
